name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Type check
        run: python -m mypy --python-version ${{ matrix.python-version }} src
      - name: Offline tests
        run: python -m pytest -m "not integration"
      - name: Rebuild portable generated artifact
        run: python scripts/build_dataset.py
      - name: Verify canonical dataset is unchanged
        run: git diff --exit-code data/problems.jsonl
