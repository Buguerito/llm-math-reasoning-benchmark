[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-math-reasoning-benchmark"
version = "0.1.0"
description = "A local-first benchmark for evaluating LLM mathematical reasoning."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "seaborn>=0.13,<1",
  "sympy>=1.13,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "nbformat>=5.10,<6",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
math-benchmark = "math_benchmark.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/math_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in tests that require a live local service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["math_benchmark"]
